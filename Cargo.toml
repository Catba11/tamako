# Tamako workspace. Refer to AGENT.md Section 4 for the crate layout.

[workspace]
resolver = "2"
members = [
    "tamako",
    "tamako-core",
    "tamako-store",
    "tamako-memory",
    "tamako-agent",
    "tamako-persona",
    "tamako-adapter-mock",
    "tamako-adapter-teloxide",
    "tamako-vision",
]

[workspace.package]
# Verified lower bound (decision 92): takecell 0.1.2 via
# teloxide-core 0.13 requires 1.96; cargo +1.96 check --workspace
# passes. The README prerequisites line mirrors this value.
rust-version = "1.96"

[workspace.dependencies]
# Async runtime. Rule of AGENT.md Section 6.2: synchronous storage calls
# run inside tokio::task::spawn_blocking.
tokio = { version = "1", features = ["full"] }

# Stream combinators for bounded-concurrent async work (decision 113,
# tamako-core's embed_texts_bounded).
futures = "0.3"

# SQLite for store.db. The bundled feature builds SQLite from source.
# No system SQLite dependency.
rusqlite = { version = "0.32", features = ["bundled"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Error handling. Rule of AGENT.md Section 6.4: libraries use thiserror,
# the binary uses anyhow.
thiserror = "2"
anyhow = "1"

# LadybugDB graph database, official Rust binding (cxx FFI over a bundled
# C++ core, built with CMake). Pin 0.18: storage-format v42 (magic bytes
# "LBUG") compatibility with the pinned Python ladybug>=0.16.0,<=0.18.2
# (proposed-graph-database-specs.md Section 10). docs.rs builds fail for
# lbug >= 0.17 (sandbox limitation); read the API from the local crate
# source or build cargo doc locally. Refer to docs/adr-0001-ladybugdb-binding.md.
lbug = "0.18"

# Deterministic node identifiers. Refer to
# proposed-graph-database-specs.md Section 7.1.
uuid = { version = "1", features = ["v5", "serde"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Cross-process advisory file locks (decision 77, H5): the per-group
# .tamako.lock of the binary — a running --live holds the group locks and
# every mutating offline CLI refuses to run against a locked group.
fd-lock = "4"

# Filesystem watcher for the live-mode persona hot reload (decision 80).
# Binary-only: the recommended-mode watcher of the tamako binary, never a
# library concern. Default features; the debounce is hand-rolled in
# tamako/src/persona_watch.rs (no notify-debouncer-* crates).
notify = "8"

# Wake-trigger jitter. Refer to specs.md Section 8.3.
rand = "0.9"

# Timestamps. The project uses the time crate, not chrono. The
# `local-offset` feature backs the warmup trigger's host-local
# active-hours window (specs.md Section 8.4, decision 78).
time = { version = "0.3", features = ["serde", "formatting", "parsing", "macros", "local-offset"] }
# IANA timezone database for the decision-90 reply-suffix time line
# (tamako-persona only). Integrates with the `time` crate above — the
# project does NOT adopt chrono for this.
time-tz = "2"

# LLM client for the digest extraction (tamako-agent only). rig entered in
# Phase 1 (AGENT.md Section 3). rig-core 0.41 has no Extractor type:
# structured extraction is a completion request with an output schema
# (Anthropic native structured output). tamako-core must NOT depend on rig.
rig = { package = "rig-core", version = "0.41" }

# JSON Schema for the rig output schema. rig-core 0.41 uses schemars 1.x;
# a schemars 0.8 Schema type is incompatible. Do not use schemars 0.8
# anywhere in the workspace.
schemars = { version = "1", features = ["preserve_order"] }

# Telegram adapter: the first real platform adapter (rule A5). Pin 0.17;
# it requires rustc >= 1.85. Rule A1: no teloxide type crosses the adapter
# boundary.
teloxide = "0.17"

# Image normalization for media captioning at intake (decision 82).
# tamako-vision only: jpeg/webp/png codecs, no full codec set.
image = { version = "0.25", default-features = false, features = ["jpeg", "webp", "png"] }

# Base64 data-URI encoding of the normalized JPEG for the vision
# caption model (decision 82). tamako-vision only.
base64 = "0.22"

# Internal crates.
tamako-core = { path = "tamako-core" }
tamako-store = { path = "tamako-store" }
tamako-memory = { path = "tamako-memory" }
tamako-agent = { path = "tamako-agent" }
tamako-persona = { path = "tamako-persona" }
tamako-adapter-mock = { path = "tamako-adapter-mock" }
tamako-adapter-teloxide = { path = "tamako-adapter-teloxide" }
tamako-vision = { path = "tamako-vision" }
