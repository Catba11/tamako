[package]
name = "tamako-agent"
version = "0.1.0"
edition = "2021"

[dependencies]
tamako-core.workspace = true
tamako-store.workspace = true
tamako-memory.workspace = true
# The shared context-format gloss of decision 61 (gate and recall
# preambles). tamako-persona is a leaf crate: acyclic (AGENT.md Section 4).
tamako-persona.workspace = true
# LLM client. Structured extraction is a completion request with an
# output schema (rig-core 0.41 has no Extractor type).
rig.workspace = true
# Must stay on 1.x: rig-core 0.41 depends on schemars 1.x.
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
time.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile = "3"
# The offline demo example replays the shipped fixture through the mock
# adapter (examples/digest_demo.rs).
tamako-adapter-mock.workspace = true
# The caption spike (tests/caption_spike.rs) builds its test image
# through the real normalize pipeline.
tamako-vision.workspace = true
image.workspace = true
# The endpoint probe example (examples/probe_endpoint.rs) posts raw HTTP
# so it stays independent of rig. 0.12 matches the reqwest version rig
# 0.41 already pulls in (Cargo.lock).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
