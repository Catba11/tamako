[package]
name = "tamako-jev-lab"
version = "0.0.0"
edition = "2021"
publish = false

# Offline benchmark fixture extractor for the jev-memory experiment
# (docs/jev-memory-benchmark.md). Lab-only crate, branch jev-memory;
# never shipped, never merged into the production binary. Reads a COPY
# of the data root (read-only store opens; lbug opens run idempotent
# DDL only) and writes JSONL fixtures for the Python driver.

[dependencies]
tokio = { workspace = true }
tamako-core = { workspace = true }
tamako-store = { workspace = true }
tamako-memory = { workspace = true }
tamako-agent = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
time = { workspace = true }
anyhow = { workspace = true }
rand = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
