# Tamako configuration template.
#
# Copy this file to `tamako.toml` and fill in your values:
#
#     cp tamako.example.toml tamako.toml
#
# `tamako.toml` is gitignored. Never commit real group ids or endpoints.
#
# Precedence, highest first (specs.md Section 13):
#   LLM keys (llm_api, llm_base_url, the *_model keys, structured_output):
#     env (TAMAKO_*) > per-group keys in this file > global keys > built-in defaults.
#   Trigger keys (suffix_mode, timezone; decisions 88/90):
#     per-group keys > env (TAMAKO_*, applies to the global values only) > global keys > built-in defaults.

[global]
# ---------------------------------------------------------------- LLM ----
# API family: "anthropic-compatible" or "openai-compatible".
# The family selects the wire format only, never the vendor (specs.md 3).
llm_api = "openai-compatible"

# Base URL of the endpoint, used verbatim.
# Opencode Go, chat/completions models (Grok, GLM, Kimi, DeepSeek, MiMo, Hy3):
llm_base_url = "https://opencode.ai/zen/go/v1"
#
# Opencode Go, MiniMax/Qwen models (Anthropic Messages format):
#   llm_api      = "anthropic-compatible"
#   llm_base_url = "https://opencode.ai/zen/go/v1/messages"

# Session id, sent as the `x-opencode-session` header on every request:
# it pins the Opencode Go gateway's session affinity, which drives the
# provider prompt cache (verified 2026-08-10: 2304/2309 prompt tokens
# cached with the header vs 0 without). Global-only; the env var
# TAMAKO_LLM_SESSION_ID wins; the default is "tamako".
#
# Decision 84: this key is the session-affinity PREFIX. Every LLM call
# sends BOTH `x-opencode-session` and `x-session-id`; when a group is
# spawned, a per-(group, purpose) random suffix is appended
# (`{prefix}-{suffix}`) and persisted in the group's store, so provider
# affinity survives restarts.
# llm_session_id = "tamako"

# ------------------------------------------------------------- Models ----
# One model per purpose. Cheap tiers for the high-frequency purposes:
# Opencode Go limits are dollar-valued (DeepSeek V4 Flash allows ~31k
# requests per 5 h, Kimi K3 only ~110). Choose accordingly.
digest_model = "mimo-v2.5"      # extraction (Section 10)
gate_model = "mimo-v2.5-pro"    # participation decision + recall gate (9.6)
reply_model = "claude-sonnet-4-5"  # reply generation (9, step 4)
# summary_model = "mimo-v2.5"   # segmented C3 summarizer (7.3); default claude-haiku-4-5

# Embeddings for the vector sidecar (global-only; decision 66). Keyed by
# OPENAI_API_KEY; the default pair is OpenRouter +
# google/gemini-embedding-2 (served by Google Vertex, ZDR). Decision 81
# re-pins the dimension to the model's NATIVE 3072; schema v11 recreated
# the vec0 table, so a boot after upgrade re-embeds everything — the
# reconciliation burst heals the index.
#
# DUAL-USE NOTE (decision 77): embeddings ALWAYS read OPENAI_API_KEY — the
# same environment variable the openai-compatible COMPLETIONS endpoints
# read. The embedding base URL resolves from TAMAKO_EMBEDDING_BASE_URL,
# then embedding_llm_base_url below, then the OpenRouter default; the
# model resolves from TAMAKO_EMBEDDING_MODEL, then embedding_model. So
# when your completions point elsewhere (the Opencode Go recipe above)
# while embeddings keep the default OpenRouter base URL, your
# OPENAI_API_KEY must be valid for OpenRouter — startup logs one WARN
# when it detects exactly this mismatch. To dual-use one provider key
# (e.g. Opencode Go embeddings), set embedding_llm_base_url to the same
# base as llm_base_url.
# embedding_model = "google/gemini-embedding-2"
# embedding_llm_base_url = "https://openrouter.ai/api/v1"

# Media captioning at intake (decision 82). Photos and static stickers are
# captioned by a vision model as they arrive; the caption rides the message
# text as a `<media>` element. Keyed by OPENAI_API_KEY, like the embeddings.
# Per-group overridable (same keys under [groups.<chat_id>]), but the intake
# enrichment resolves ONE process-wide provider from the global values at
# cutover; per-group caption models are follow-up.
#
# ZDR NOTE: the default model minimax/minimax-m3 is served via OpenRouter
# because the first-party MiniMax endpoint is NOT ZDR — the account's
# ZDR-only policy routes to ZDR third-party providers through OpenRouter.
# caption_model = "minimax/minimax-m3"
# caption_llm_base_url = "https://openrouter.ai/api/v1"

# Per-purpose endpoint overrides for mixed deployments. Example:
# reply_llm_api      = "anthropic-compatible"
# reply_llm_base_url = "https://opencode.ai/zen/go/v1/messages"

# Structured-output mode per endpoint: "schema" | "json_object" | "prompt_only"
# (default "schema"). Per-purpose overrides: digest_structured_output /
# gate_structured_output / reply_structured_output /
# summary_structured_output; env wins as always.
# "json_object" applies on the OpenAI family only; on Anthropic it
# degrades to prompt-only (the Messages API has no json_object format).
# Structured-output support is PER MODEL on Opencode Go: the mimo
# chat/completions models honor "schema" strictly (verified 2026-08-08);
# DeepSeek models reject json_schema with "bad response format" and need
# "prompt_only" (verified 2026-08-10). Run
# `cargo run -p tamako-agent --example probe_endpoint` against the exact
# model of each purpose; do not extrapolate across models.
# structured_output = "schema"

# ------------------------------------------------------------ Triggers ----
# All optional. Defaults in specs.md Section 13.
# wake_msg_count = 5
# wake_interval_secs = 3600
# wake_floor_secs = 300
# digest_max_messages = 100
# digest_timeout_secs = 21600
# digest_max_retries = 5        # total attempts, including the first
# monologue_limit = 2
# reply_staleness_threshold = 20
# recall_injection_cap = 5
# reply_quote_threshold = 10    # quote the reply target only beyond this (6.2)
# gate_context = true           # the gates see the shared context view (9.6)
# suffix_mode = "system"          # suffix placement (9.4, decision 88): "system" (separate trailing
#                                 # system message) or "append" (merged into the final user instruction)
#                                 # decision 98: per-group "append" requires the global mode to be
#                                 # "append" too (loud startup error otherwise); a group may replace
#                                 # the suffix BODY via {data_root}/{chat_id}/persona.toml
# timezone = "Asia/Shanghai"        # decision 90: the reply-suffix <now> current-time line; an IANA
#                                 # name or a fixed "+08:00" offset; unset = no time line

# ------------------------------------------------------- Memory (P2) ----
# vector_resolution = true          # step-3 vector pre-screen (graph 7.4)
# vector_candidate_threshold = 0.88 # decision 104 (calibrated 2026-09-07)
# resolution_confirm_budget = 5     # per digest batch; every candidate confirms
# merge_candidate_threshold = 0.90  # merge-tool scan (graph 7.7)
# single_value_predicates = ["currently_playing", "works_at", "lives_in", "dating"]
# deep_recall = true                # false restores the Phase 1 shallow recall (9.1)
# recall_candidate_cap = 40         # per wake, before the relevance gate

# -------------------------------------------- Warmup (P2, 8.4/8.5) ----
# All optional, all per-group overridable like the trigger keys.
# The pet starts conversations on its own: topics come from the group's
# own graph (a Concept node sampled with weight edge-count x
# recency-decay); a group with no eligible topic stays silent. Ignored
# warmups back off (effective quota -1 and 2x spacing each, resetting on
# engagement).
# warmup = true                       # master switch (8.4); false disables proactive warmups entirely
# warmup_quota = 1                    # 1-3 per host-local day; outside 1..=3 is a startup error
# warmup_active_hours = "08:00-23:00" # host-local "HH:MM-HH:MM"; overnight ranges rejected
# warmup_silence_secs = 14400         # the group must be silent this long (8.4)
# warmup_reaction_window_secs = 1800  # engagement window (8.5); reactions reach administrator groups only (4.2)
# warmup_topic_cooldown_days = 3      # per-topic cooldown (9.7)

# forced_wake_cooldown_secs = 10      # suppress back-to-back forced wakes (8.1); 0 disables

# -------------------------------------------------------------- Groups ----
# One table per group. An empty table registers the group with defaults.
# Telegram supergroup ids are negative and start with -100. Quote them.
[groups."-1001234567890"]
# Per-group trigger overrides go here, same keys as [global].
